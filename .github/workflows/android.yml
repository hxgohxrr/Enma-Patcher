name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug -x lint -Pgpr.user=${{ secrets.GPR_USER }} -Pgpr.key=${{ secrets.GPR_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: EnmaPatcher-debug
          path: app/build/outputs/apk/debug/app-debug.apk
